<!DOCTYPE html>

<html>
	<head>
		<title>The Shore</title>
		<link href="style.css" rel="stylesheet">
		<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
	</head>
	<body>
		<header>
			<h1>The Shore</h1>
		</header>
		<main>
			<div id="main-content">
				<p>A bottle wash on the shore near you...</p>
			</div>
			<div id="control">
				<p>Tap the screen to view.</p>
				<a id="write" href="#">Write your own message.</a>
			</div>

			<div id="write" class="flex flex-col">
				<textarea name="Message" id="msg" cols="30" rows="5"></textarea>
				<input type="button" value="Submit" class="btn bg-blue-100 rounded shadow hover:bg-blue-200">
			</div>
		</main>
		<footer>
			<a href="privacy.html">Privacy and policy</a>
		</footer>
	</body>
</html>
